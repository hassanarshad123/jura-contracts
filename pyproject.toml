[project]
name = "juraai-contracts"
version = "0.1.4"
description = "Jura AI — shared cross-repo contracts (JSON Schema, codegen to TypeScript + Python)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Zensbot LLC" }]

dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator>=0.71.0",
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/juraai_contracts", "validators/python/juraai_contracts_validators"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["generated/python", "validators/python"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["validators/python", "codegen"]
