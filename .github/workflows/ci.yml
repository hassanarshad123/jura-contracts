name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codegen-drift:
    name: codegen is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          enable-cache: true

      - run: npm ci
      - run: uv sync --extra dev

      # The whole point of this repo is that generated/ is a pure function of schemas/. If a
      # schema was edited but codegen wasn't re-run before committing, this catches the drift
      # (the two consuming languages would silently disagree with schemas/ otherwise).
      - name: Regenerate and diff against the committed output
        run: |
          npm run codegen
          git diff --exit-code generated/ || (echo "::error::generated/ is out of date - run 'npm run codegen' and commit the result" && exit 1)

  typescript:
    name: ts lint · types · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      # CHARTER.md §3's CI-parity bar requires a type-check gate on every repo (code review
      # finding, 2026-07-27): `npm test` alone doesn't check types - it runs .test.mjs files that
      # import .ts sources via Node's type-stripping, which ERASES annotations syntactically
      # rather than checking them. `npm run build` runs the real `tsc` compile, matching the
      # `prepare` script every git-dependency consumer already relies on.
      - run: npm run build
      - run: npm test

  python:
    name: py lint · types · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          enable-cache: true

      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy generated/python validators/python
      - run: uv run pytest codegen/ validators/python/
